<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İgris · Giriş</title>
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/intro_art.js"></script>
  <script src="/static/intro.js"></script>
  <meta name="theme-color" content="#02030a">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body class="login-page">
  <main class="card login-card">
    <p class="eyebrow">İgris</p>
    <h1 class="title">Hesabınıza giriş yapın</h1>
    <p class="muted">Sohbetlerinize ve çalışma alanınıza devam edin.</p>
    <form id="login-form">
      <label class="field-label" for="username">Kullanıcı adı</label>
      <input id="username" name="username" type="text" autocomplete="username"
             required maxlength="64" autofocus>
      <label class="field-label" for="password">Parola</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required maxlength="256">
      <p id="login-error" class="status is-error" role="alert"></p>
      <button id="login-submit" class="btn btn-primary" type="submit">Giriş yap</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
  <script src="/static/pwa.js"></script>
</body>
</html>
